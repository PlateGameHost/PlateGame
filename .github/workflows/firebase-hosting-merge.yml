name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - prod
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies & build Vite app
        working-directory: ./plate-game
        run: |
          npm ci
          npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          entryPoint: ./plate-game
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLATE_GAME_F1495 }}
          channelId: live
          projectId: plate-game-f1495
