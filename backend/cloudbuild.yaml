steps:
  # 1. Build the container image using Google Cloud Buildpacks
  - name: "gcr.io/k8s-skaffold/pack"
    entrypoint: "pack"
    args:
      - "build"
      - "$_IMAGE_NAME"
      - "--builder"
      - "gcr.io/buildpacks/builder:v1"
      - "--env"
      - "GOOGLE_ENTRYPOINT=gunicorn --bind :$$PORT --workers 1 --threads 8 --timeout 0 app:app"

  # 2. Push the image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "$_IMAGE_NAME"]

  # 3. Deploy the container image to Cloud Run in Toronto
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "plategame-api"
      - "--image"
      - "$_IMAGE_NAME"
      - "--region"
      - "northamerica-northeast2"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"

substitutions:
  _IMAGE_NAME: "northamerica-northeast2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/plategame:$COMMIT_SHA"

# Resolves the logging bucket error by sending logs straight to Cloud Logging
options:
  logging: CLOUD_LOGGING_ONLY
